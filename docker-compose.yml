version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: insurance-db
    environment:
      POSTGRES_USER: insurance_user
      POSTGRES_PASSWORD: insurance_password
      POSTGRES_DB: insurance_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - insurance-network

volumes:
  postgres_data:

networks:
  insurance-network:
    driver: bridge